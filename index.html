<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dominion Lab</title>
<meta name="description" content="Play Dominion against measured computer players, with live deck odds, a kingdom randomizer and a study mode.">
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dominion Lab">
<link rel="stylesheet" href="css/table.css?v=1">
<link rel="stylesheet" href="css/profile.css?v=1">
<link rel="stylesheet" href="css/coach.css?v=1">
<style>
  :root {
    --bg: #0f1117; --bg-soft: #161923; --card: #1a1e2b; --card-hover: #212636; --line: #2a3042;
    --text: #e8eaf0; --muted: #969db4; --accent: #6ea8fe; --accent-warm: #f0b354;
    --good: #6ee7a8; --bad: #f08c8c; --felt: #17342a;
    --t-action: #e9e2d0; --t-treasure: #f0cf6a; --t-victory: #8fcf86; --t-curse: #b48ad0; --t-attack: #e79b8f; --t-reaction: #8fb8e8;
    --radius: 12px; --tabbar: 58px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  button { font: inherit; color: inherit; }
  #app { height: 100dvh; display: flex; flex-direction: column; overflow-x: clip; }
  .view { display: none; flex: 1; min-height: 0; padding: 10px 12px 8px; }
  .view.on { display: flex; flex-direction: column; }

  /* ------------------------------------------------ tab bar (phone bottom, laptop top) */
  nav.tabs { order: 2; height: calc(var(--tabbar) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    display: flex; background: #12151e; border-top: 1px solid var(--line); flex: none; }
  nav.tabs button { flex: 1; background: none; border: 0; color: var(--muted); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; cursor: pointer; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button.on { color: var(--accent); }
  nav.tabs .brand { display: none; }
  @media (min-width: 900px) {
    nav.tabs { order: 0; height: 52px; padding: 0 16px; border-top: 0; border-bottom: 1px solid var(--line); justify-content: flex-start; gap: 6px; }
    nav.tabs .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; margin-right: 22px; color: var(--text); text-decoration: none; }
    nav.tabs .brand img { width: 26px; height: 26px; border-radius: 6px; }
    nav.tabs button { flex: none; flex-direction: row; font-size: 14px; padding: 0 14px; gap: 8px; border-radius: 9px; height: 38px; align-self: center; }
    nav.tabs button.on { background: rgba(110,168,254,.12); }
    nav.tabs button svg { width: 18px; height: 18px; }
    .view { padding: 14px 18px 14px; }
  }

  /* ------------------------------------------------ common bits */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0 16px; cursor: pointer;
    font-weight: 650; transition: background .12s, transform .08s, border-color .12s; white-space: nowrap; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0d1424; }
  .btn.warm { background: var(--accent-warm); border-color: var(--accent-warm); color: #24180a; }
  .btn.ghost { background: transparent; }
  .btn.small { min-height: 34px; padding: 0 11px; font-size: 13.5px; border-radius: 8px; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; min-height: 44px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-weight: 650; font-size: 14px; padding: 4px 6px; }
  .seg button[aria-pressed="true"] { background: rgba(110,168,254,.14); border-color: var(--accent); color: var(--accent); }
  .seg button small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .label { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .q { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg-soft); color: var(--muted);
    font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; vertical-align: middle; flex: none; }
  .pop { position: fixed; z-index: 60; max-width: min(320px, calc(100vw - 32px)); background: #232838; border: 1px solid #3a4258; border-radius: 10px;
    padding: 10px 12px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #2f3548; border-radius: 14px; transition: background .15s; cursor: pointer; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
  .pct { font-variant-numeric: tabular-nums; font-weight: 750; }

  /* ------------------------------------------------ card faces: real Dominion layout (name banner, picture, text box, type banner, cost coin bottom-left)
     every size comes from --cw (card width); height = real 59 x 92 mm ratio */
  .cf { --cw: 64px; --frame: linear-gradient(160deg, #efe5c9, #d6c79f); --paper: #f8f1dc; --ink: #2a2012; --art-h: calc(var(--cw) * .52);
    position: relative; flex: none; box-sizing: border-box; width: var(--cw); height: calc(var(--cw) * 92 / 59);
    font-size: calc(var(--cw) * .155); border-radius: calc(var(--cw) * .065); padding: calc(var(--cw) * .045);
    background: var(--frame); color: var(--ink); border: 1px solid rgba(0,0,0,.5);
    display: flex; flex-direction: column; gap: calc(var(--cw) * .03); overflow: hidden; cursor: pointer; user-select: none; -webkit-user-select: none;
    box-shadow: 0 1px 1px rgba(0,0,0,.35), 0 3px 7px rgba(0,0,0,.35);
    outline: 2px solid transparent; outline-offset: 1px; transition: outline-color .14s, box-shadow .14s, opacity .15s, filter .15s; }
  .cf::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,.28), transparent 36%, transparent 72%, rgba(0,0,0,.08)); }
  .cf.Treasure { --frame: linear-gradient(160deg, #f0cd62, #c5962a); --paper: #f8e9ab; }
  .cf.Victory { --frame: linear-gradient(160deg, #8dbb6a, #557f3c); --paper: #e6f0d4; }
  .cf.Curse { --frame: linear-gradient(160deg, #9b6bbb, #5f3a7c); --paper: #eadcf2; }
  .cf.Reaction { --frame: linear-gradient(160deg, #86acd8, #4a73a6); --paper: #e2ebf6; }
  .cf .nm { flex: none; height: calc(var(--cw) * .27); display: flex; align-items: center; justify-content: center; text-align: center;
    font: 700 1em/1 "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; letter-spacing: -.01em; padding: 0 .3em; white-space: nowrap; overflow: hidden;
    background: linear-gradient(#fdf8ea, #e7d9b4); border: 1px solid rgba(70,50,15,.55); border-radius: .55em / 50%; box-shadow: inset 0 -1px 0 rgba(120,90,30,.25); }
  .cf .nm.l2 { font-size: .86em; }
  .cf .nm.l3 { font-size: .74em; white-space: normal; line-height: .98; }
  .cf .art { flex: none; display: block; width: 100%; height: var(--art-h); border: 1px solid rgba(40,25,5,.55); border-radius: 2px; box-sizing: border-box; }
  .cf .tx { flex: 1; min-height: 0; overflow: hidden; background: var(--paper); border-radius: 2px; border: 1px solid rgba(70,50,15,.3);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: .15em;
    font: .6em/1.15 "Palatino Linotype", Palatino, Georgia, serif; padding: .2em .35em; }
  .cf .tx b { font-size: 1.25em; line-height: 1.05; }
  .cf .tx .rule { width: 60%; height: 1px; background: rgba(60,40,10,.4); flex: none; }
  .cf .tx .big { font: 800 3.2em/1 Georgia, serif; }
  .cf .tx .big.coinv { width: 1.3em; height: 1.3em; border-radius: 50%; display: grid; place-items: center; font-size: 2.5em;
    background: radial-gradient(circle at 35% 30%, #fff3b8, #e2ad2a 60%, #a8770f); color: #4a3300; box-shadow: inset 0 -2px 2px rgba(0,0,0,.25), 0 1px 2px rgba(0,0,0,.35); }
  .cf .ty { flex: none; height: calc(var(--cw) * .2); display: flex; align-items: center; justify-content: center; padding-left: 1.4em;
    background: linear-gradient(#fbf4df, #e2d3ab); border: 1px solid rgba(70,50,15,.45); border-radius: 2px;
    font: 700 .58em/1 "Palatino Linotype", Palatino, Georgia, serif; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  .cf .cost { position: absolute; z-index: 1; left: calc(var(--cw) * .035); bottom: calc(var(--cw) * .03); width: calc(var(--cw) * .25); height: calc(var(--cw) * .25);
    border-radius: 50%; display: grid; place-items: center; font: 800 calc(var(--cw) * .15)/1 Georgia, serif; color: #3a2a00;
    background: radial-gradient(circle at 35% 30%, #fff1ad, #e0a92a 62%, #a5760f); border: 1px solid #8a640c; box-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .cf .ty.l2 { font-size: .46em; letter-spacing: 0; }
  .cf .ty.l3 { font-size: .42em; letter-spacing: 0; }
  /* small cards (supply piles, cards in play, opponents): picture + name + coin, no text */
  .cf.xs { --art-h: calc(var(--cw) * .93); }
  .cf.xs .tx { display: none; }
  .cf.xs .ty { font-size: 0; }
  .cf.xs .nm { font-size: 1em; padding: 0 .15em; letter-spacing: -.03em; } .cf.xs .nm.l2 { font-size: .84em; } .cf.xs .nm.l3 { font-size: .74em; }
  .cf.sel { outline: 3px solid var(--accent-warm); outline-offset: 0; box-shadow: 0 0 14px rgba(240,179,84,.6), 0 3px 7px rgba(0,0,0,.4); }
  .cf.can { outline-color: rgba(110,168,254,.9); }
  .cf.dim { filter: grayscale(.35) brightness(.78); }
  .cf.big { --cw: 150px; cursor: default; }
  .cf.big .tx { font-size: .66em; }
  /* the shared card back (own design: tan margin, dark field, gold lattice) */
  .dom-back { --back: #26364f; --ink: rgba(222,186,110,.32); --back-frame: #c7a56c; }
  .dom-back::before { content: ""; position: absolute; left: 50%; top: 50%; width: 34%; aspect-ratio: 1; transform: translate(-50%,-50%) rotate(45deg);
    background: radial-gradient(circle, #e8c77e 0 22%, transparent 24%), #26364f; border: 1.5px solid #d8b56f; box-shadow: 0 0 0 2px #26364f; }
  @keyframes playin { from { transform: translateY(30px) rotate(-5deg) scale(1.08); opacity: 0; } to { transform: none; opacity: 1; } }
  .cf.popin { animation: playin .3s ease-out both; }
  .cf.dealing { visibility: hidden; }
  .dealghost { position: fixed; z-index: 2147482000; pointer-events: none; margin: 0; perspective: 700px; }
  .dealghost .dg-in { position: absolute; inset: 0; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; transform: rotateY(180deg); transition: transform .26s ease-out; }
  .dealghost .dg-in.up { transform: none; }
  .dealghost .dg-in > * { position: absolute; left: 0; top: 0; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; margin: 0; }
  .dealghost .dg-in > .tbl-back { transform: rotateY(180deg); }
  /* WebKit can paint a face's children through backface-visibility: swap faces at the half turn instead */
  .dealghost .dg-in > .cf { visibility: hidden; } .dealghost .dg-in.half > .cf { visibility: visible; } .dealghost .dg-in.half > .tbl-back { visibility: hidden; }

  /* ------------------------------------------------ the table (wooden table top, real layout from the player's seat) */
  #v-play.ingame { padding: 0; }
  #game { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
  #table { min-height: 0; min-width: 0; display: grid; gap: 5px; padding: 6px 10px 8px; grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) minmax(50px, auto) 50px 112px 24px 44px;
    grid-template-areas: "opps" "supply" "info" "play" "me" "odds" "acts"; }
  #g-side { display: none; }
  .icon-btn { width: 40px; height: 36px; border-radius: 8px; border: 1px solid rgba(255,230,180,.25); background: rgba(20,12,6,.55); color: #f3efe4; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .icon-btn svg { width: 18px; height: 18px; }

  /* opponents' seats across the far side */
  .opps { grid-area: opps; display: flex; align-items: flex-start; gap: 6px; min-width: 0; }
  .oppseats { display: flex; gap: 6px; flex: 1; min-width: 0; justify-content: space-around; }
  .seat { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; flex: 1 1 0; }
  .seat .tbl-plate { display: flex; align-items: center; gap: 4px; max-width: 100%; font-size: 11.5px; line-height: 16px; padding: 1px 6px; }
  .tbl-plate .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  @media (max-width: 360px) { .seat .tbl-plate .dot { display: none; } .seat .tbl-plate { padding: 1px 4px; } }
  .tbl-plate .nmx { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tbl-plate b { font-variant-numeric: tabular-nums; color: #ffe1a0; }
  .tbl-plate.turn { border-color: #f0c35a; box-shadow: 0 0 0 2px rgba(240,195,90,.45), 0 2px 4px rgba(0,0,0,.4); }
  .tbl-plate.off { opacity: .5; }
  .seat .things { display: flex; align-items: flex-end; gap: 5px; --card-w: 14px; --ratio: 59 / 92; }
  .seat .things .cf { --cw: 14px; border-radius: 2px; padding: 1px; gap: 0; }
  .seat .things .cf .nm, .seat .things .cf .ty, .seat .things .cf .cost { display: none; }
  .seat .things .cf.xs { --art-h: 100%; }
  .seat .sfan { position: relative; width: 34px; }
  .seat .sfan .tbl-card { --card-w: 12px; }
  .seat .tbl-badge { font-size: 9px; line-height: 12px; min-width: 14px; padding: 0 3px; right: -5px; bottom: -4px; }
  .seat .tbl-deck.is-empty { border-width: 1px; }
  .tbl-card.dom-back { --ratio: 59 / 92; }

  /* the Supply: basics (Treasures, Victory, Curse, Trash) + Kingdom in 2 rows of 5, every pile a stack */
  .supply { grid-area: supply; container-type: size; min-height: 0; position: relative; }
  .sup { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    --cwb: min(calc((100cqw - 30px) / 7), calc(100cqh * .3 / 1.56));
    --cwk: min(calc((100cqw - 24px) / 5), calc((100cqh - 18px - var(--cwb) * 1.56) / 3.12)); }
  .basics { display: flex; gap: 5px; align-items: flex-end; }
  .basics .pile { --cw: var(--cwb); }
  .kingdom { display: grid; grid-template-columns: repeat(5, auto); gap: 6px 6px; }
  .kingdom .pile { --cw: var(--cwk); }
  .pile { position: relative; width: var(--cw); height: calc(var(--cw) * 92 / 59); flex: none; cursor: pointer; }
  .pile > .cf { --cw: inherit; position: absolute; left: 0; top: 0; }
  .pile .cnt { position: absolute; z-index: 2; right: -3px; bottom: -4px; min-width: 15px; text-align: center; background: #1b1b1f; color: #fff;
    font: 750 9.5px/14px system-ui, sans-serif; border-radius: 7px; padding: 0 4px; box-shadow: 0 1px 3px rgba(0,0,0,.5); pointer-events: none; }
  .pile.empty::before { content: ""; position: absolute; inset: 0; border: 2px dashed rgba(255,235,200,.35); border-radius: calc(var(--cw) * .065); }
  .pile.empty > .cf { opacity: .22; box-shadow: none; }
  .pile.hint::after { content: ""; position: absolute; z-index: 2; right: 4px; top: 42%; width: 9px; height: 9px; border-radius: 50%; background: var(--good); box-shadow: 0 0 6px var(--good), 0 0 0 1.5px #10301e; }
  .pile.trash { display: none; cursor: default; }
  .pile.trash::before { content: ""; position: absolute; inset: 0; border: 2px dashed rgba(255,235,200,.35); border-radius: calc(var(--cw) * .065); }
  .pile.trash > .lbl { position: absolute; inset: 0; display: grid; place-items: center; font: 700 calc(var(--cw) * .16)/1 Georgia, serif; color: rgba(255,235,200,.55); letter-spacing: .04em; }
  .pile.trash > .cf { transform: rotate(-4deg); }
  .emptytag { flex: none; font: 700 11px/16px system-ui, sans-serif; padding: 1px 7px; border-radius: 4px; background: rgba(20,12,6,.7); color: #f3efe4; border: 1px solid rgba(255,230,180,.25); }
  .opps .emptytag { display: none; align-self: center; }
  .emptytag.warn { border-color: var(--bad); color: #ffc2c2; }

  /* helpers (prompt, odds) sit on the table as dark glass plates */
  .info { grid-area: info; background: rgba(14,10,6,.72); border: 1px solid rgba(255,230,180,.16); border-left: 3px solid var(--accent); border-radius: 8px; padding: 4px 10px; overflow: hidden; color: var(--text); }
  .info.mine { border-left-color: var(--accent-warm); }
  .info .p1 { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info .p2 { font-size: 12.5px; color: #c4c0b4; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .info .p2 b { color: var(--text); }
  .info-card { display: none; }
  /* game over: the result uses the play area too, so who won and why is never cut off */
  #table.over .info { grid-area: 3 / 1 / 5 / 2; align-self: start; max-height: 100%; }
  #table.over .info { display: block; padding-top: 4px; padding-bottom: 4px; }
  #table.over .info .p2 { display: -webkit-box; -webkit-line-clamp: 4; }
  .odds { grid-area: odds; display: flex; align-items: center; gap: 10px; font-size: 12.5px; background: rgba(14,10,6,.6); border: 1px solid rgba(255,230,180,.14); border-radius: 8px; padding: 0 8px; cursor: pointer; min-width: 0; white-space: nowrap; color: var(--text); }
  .odds .cells { display: flex; gap: 12px; flex: 1; min-width: 0; }
  .odds .label { color: #c9bea6; }
  .odds .deck { color: #c4c0b4; font-size: 12px; white-space: nowrap; }
  @media (max-width: 899px) { .odds .deck { display: none; } .odds .deck.grow { display: inline; }
    /* an "Empty N" chip takes the label's place so it never sits on top of the odds */
    .odds:has(.emptytag) > .label { display: none; } .odds .cells { overflow: hidden; } }
  @media (max-width: 360px) { .odds { gap: 7px; } .odds .cells { gap: 8px; } }
  @media (max-width: 360px), (max-width: 899px) and (orientation: landscape) { .seat .sfan { width: 26px; } .oppseats { gap: 4px; } .seat .things { gap: 3px; } }
  @media (max-width: 899px) and (orientation: landscape) { .seat .tbl-plate .dot { display: none; } .seat .tbl-plate { padding: 1px 4px; gap: 3px; } }
  .odds .q { width: 18px; height: 18px; }

  /* the play area in front of the player whose turn it is */
  .play { grid-area: play; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .play .cards { display: flex; align-items: center; flex: 1; min-width: 0; height: 100%; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding: 0 2px; }
  .play .cards::-webkit-scrollbar { display: none; }
  .play .cards .cf { --cw: 31px; }
  .play .cards .cf + .cf { margin-left: -6px; }
  .play .cards.pick .cf { --cw: 31px; }
  .play .cards.pick .cf + .cf { margin-left: 4px; }
  /* copies played this turn stack up with a count; tap a stack to read the card */
  .play .cards .pst { position: relative; display: flex; flex: none; cursor: pointer; }
  .play .cards .pst + .pst { margin-left: 5px; }
  .play .cards .pst .cf + .cf { margin-left: calc(var(--cw) * -.84); }
  .play .cards .pst.multi { margin-right: 9px; }
  .play .cards .cap.whose { margin-left: 8px; }
  .play .cards .pcount { position: absolute; z-index: 3; right: -10px; bottom: 1px; min-width: 15px; text-align: center; background: #1b1b1f; color: #fff;
    font: 750 10px/14px system-ui, sans-serif; border-radius: 7px; padding: 0 4px; box-shadow: 0 1px 3px rgba(0,0,0,.5); pointer-events: none; }
  .seat .sdisc[data-look] { cursor: pointer; position: relative; }
  .seat .sdisc[data-look]::after { content: ""; position: absolute; inset: -12px -8px; } /* a finger-sized tap area round the small pile */
  @media (min-width: 900px) { .play .cards .pcount { font-size: 12px; line-height: 17px; border-radius: 9px; padding: 0 5px; } }
  .play .cap { font-size: 11.5px; color: rgba(255,235,200,.34); letter-spacing: .06em; text-transform: uppercase; font-weight: 700; white-space: nowrap; }
